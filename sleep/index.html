<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер сну</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="../assets/icon-1024.png" />
    <meta name="music-base" content="../sounds/" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="sleep.css" />
  </head>
  <body>
    <div class="container">
      <div class="sleep-header">
        <a href="../index.html" class="sleep-back">← Назад</a>
        <h1 class="sleep-title">Трекер <span>сну</span></h1>
        <button id="themeToggle" class="theme-btn" aria-label="Змінити тему">☀️</button>
      </div>

      <div id="status" class="status-bar">Підключення...</div>

      <!-- STATS -->
      <div class="card sleep-stats-card">
        <div class="sleep-stats-grid">
          <div class="sleep-stat">
            <div class="sleep-stat-label">Середня тривалість</div>
            <div class="sleep-stat-val" id="sleepAvgDur">—</div>
          </div>
          <div class="sleep-stat">
            <div class="sleep-stat-label">Цього тижня</div>
            <div class="sleep-stat-val" id="sleepWeek">—</div>
          </div>
          <div class="sleep-stat">
            <div class="sleep-stat-label">Найдовший</div>
            <div class="sleep-stat-val" id="sleepMax">—</div>
          </div>
          <div class="sleep-stat">
            <div class="sleep-stat-label">Найкоротший</div>
            <div class="sleep-stat-val" id="sleepMin">—</div>
          </div>
        </div>
      </div>

      <!-- ADD FORM -->
      <div class="card sleep-add" id="sleepAdmin">
        <div class="section-title sleep-form-title" id="sleepFormTitle">Додати запис</div>

        <label>Заснув</label>
        <input type="datetime-local" id="sleepStart" />

        <label>Прокинувся</label>
        <input type="datetime-local" id="sleepEnd" />

        <div class="sleep-duration-preview" id="sleepDurationPreview">Тривалість: —</div>

        <label>Якість сну</label>
        <select id="sleepQuality">
          <option value="5">Відмінно</option>
          <option value="4">Добре</option>
          <option value="3" selected>Нормально</option>
          <option value="2">Погано</option>
          <option value="1">Жахливо</option>
        </select>

        <label>Нотатка (необов'язково)</label>
        <input type="text" id="sleepNote" placeholder="Напр.: пив каву на ніч" />

        <button id="sleepSaveBtn" class="primary-btn">Зберегти</button>
        <button id="sleepCancelEdit" class="primary-btn btn-outline-danger sleep-cancel">Скасувати</button>
      </div>

      <div id="sleepLoginHint" class="sleep-login-hint">
        Увійдіть як адмін у <a href="../index.html">Кімнаті Рекордів</a>, щоб додавати записи
      </div>

      <!-- HISTORY -->
      <div class="section-title">Історія сну</div>
      <div id="sleepTimeline"></div>
      <div id="sleepEmpty" class="empty-state sleep-hidden">Ще немає записів. Додай свій перший сон.</div>
    </div>

    <script type="module" src="sleep.js"></script>
  </body>
</html>
